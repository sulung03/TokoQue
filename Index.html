<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TokoQue - Kasir Pintar & Manajemen Toko</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5 QR / Barcode Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ========================================================= */
        /* STYLESHEET CETAK STRUK THERMAL STANDAR (58MM / 80MM)     */
        /* ========================================================= */
        #receipt-print-area { display: none; }

        @media print {
            html, body {
                overflow: visible !important;
                height: auto !important;
                min-height: auto !important;
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #app, #modal-root, #toast-container, #loading-overlay, header, footer, main {
                display: none !important;
                visibility: hidden !important;
            }

            #receipt-print-area {
                display: block !important;
                visibility: visible !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 auto !important;
                padding: 1mm 2mm !important;
                background: #ffffff !important;
                color: #000000 !important;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 11px !important;
                line-height: 1.25 !important;
            }

            #receipt-print-area * {
                visibility: visible !important;
                color: #000000 !important;
                background: transparent !important;
            }

            @page {
                size: auto;
                margin: 0mm !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased overflow-hidden select-none">

    <!-- Container Utama Aplikasi (Mendukung 100dvh untuk Browser HP) -->
    <div id="app" class="h-[100dvh] w-full flex flex-col overflow-hidden">
        <div class="flex flex-col items-center justify-center w-full h-full space-y-4">
            <i data-lucide="loader-2" class="animate-spin text-blue-600 w-12 h-12"></i>
            <p class="text-slate-600 font-extrabold text-sm tracking-wide">Menyiapkan TokoQue...</p>
        </div>
    </div>

    <!-- Overlay Loading Global -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 z-[150] flex-col items-center justify-center hidden backdrop-blur-sm transition-opacity">
        <i data-lucide="loader-2" class="animate-spin text-white w-12 h-12 mb-3"></i>
        <p id="loading-text" class="text-white font-extrabold text-base tracking-wide">Memproses data...</p>
    </div>

    <!-- Container Notifikasi Toast -->
    <div id="toast-container" class="fixed top-3 right-3 sm:top-5 sm:right-5 z-[200] flex flex-col gap-2.5 pointer-events-none *:pointer-events-auto max-w-[92vw] sm:max-w-sm"></div>

    <!-- Root untuk Modal Dialog -->
    <div id="modal-root"></div>

    <!-- Container Khusus Modal Kamera Barcode -->
    <div id="camera-modal-container"></div>

    <!-- Area Khusus Cetak Struk Thermal -->
    <div id="receipt-print-area"></div>

    <!-- Frame Tersembunyi Khusus Cetak Thermal Langsung -->
    <iframe id="thermal-print-iframe" class="fixed right-0 bottom-0 w-0 h-0 border-0 opacity-0 pointer-events-none"></iframe>

    <script>
        // URL Database Google Apps Script Aktif (Diperbarui ke URL baru Anda)
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbVewZpjTm7kR44rUK6-v6hYagWGpKnJyvwnqabyM6iq4ent5FM_jzFz5wPhQ12bLwRcg/exec";

        function getActiveScriptUrl() {
            const saved = localStorage.getItem('tokoque_script_url');
            if (saved && saved.trim() !== '') {
                return saved.trim();
            }
            if (state && state.settings && state.settings.scriptUrl && state.settings.scriptUrl.trim() !== '') {
                return state.settings.scriptUrl.trim();
            }
            return DATABASE_URL;
        }

        let state = {
            products: [],
            customers: [],
            employees: [
                { id_karyawan: 'KRY001', nama: 'Administrator', username: 'admin', pin: '123123', role: 'admin', no_hp: '08123456789' },
                { id_karyawan: 'KRY002', nama: 'Admin Cadangan', username: 'admin_backup', pin: 'admin123', role: 'admin', no_hp: '08123456789' }
            ],
            transactions: [],
            cart: [],
            user: null,
            settings: {
                storeName: 'Toko Sulung',
                address: 'Desa Sukamulya Blok PG2',
                phone: '087777282882',
                receiptFooter: 'Terima kasih atas kunjungan Anda!\nBarang yang sudah dibeli tidak dapat dikembalikan.',
                autoPrint: true,
                printerMode: 'system',
                defaultPrinterName: 'POS-58',
                printerType: 'usb',
                usbPrinterName: 'POS-58',
                bluetoothName: '',
                paperWidth: '58mm',
                scriptUrl: ''
            },
            bluetoothDevice: null,
            bluetoothCharacteristic: null,
            directPort: null,
            currentTab: 'kasir',
            filterKategori: 'semua',
            searchKasirQuery: '',
            searchBarangQuery: '',
            searchPelangganQuery: '',
            filterPelangganHutang: 'semua',
            selectedCustomerKasir: '',
            diskonNominal: 0,
            filterLaporanPeriode: 'hari_ini',
            lastTransaction: null,
            paperWidth: '58mm'
        };

        function formatRp(angka) {
            return "Rp " + Number(angka || 0).toLocaleString('id-ID');
        }

        function formatRibuan(angka) {
            return Number(angka || 0).toLocaleString('id-ID');
        }

        function formatInputRibuan(input) {
            let val = String(input.value).replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('id-ID') : '';
        }

        function togglePasswordVisibility(inputId, trigger) {
            const input = document.getElementById(inputId);
            if (!input) return;
            let el = typeof trigger === 'string' ? document.getElementById(trigger) : trigger;

            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            const iconName = isPassword ? 'eye-off' : 'eye';

            if (el) {
                if (el.tagName === 'BUTTON') {
                    el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
                } else {
                    el.setAttribute('data-lucide', iconName);
                }
            }
            if (window.lucide) lucide.createIcons();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toastId = 'toast_' + Math.random().toString(36).substr(2, 9);
            let bgColor = 'bg-emerald-600 text-white';
            let icon = 'check-circle';

            if (type === 'error') { bgColor = 'bg-rose-600 text-white'; icon = 'alert-circle'; }
            else if (type === 'warning') { bgColor = 'bg-amber-500 text-white'; icon = 'alert-triangle'; }
            else if (type === 'info') { bgColor = 'bg-blue-600 text-white'; icon = 'info'; }

            const toastHTML = `
                <div id="${toastId}" class="flex items-center gap-3 px-4 py-3 ${bgColor} rounded-2xl shadow-xl transform transition-all duration-300 translate-x-full opacity-0 max-w-sm border border-white/20">
                    <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i>
                    <p class="text-xs font-bold leading-tight flex-1">${message}</p>
                    <button onclick="document.getElementById('${toastId}').remove()" class="text-white/80 hover:text-white p-1">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', toastHTML);
            if (window.lucide) lucide.createIcons();

            const toastEl = document.getElementById(toastId);
            requestAnimationFrame(() => {
                if (toastEl) {
                    toastEl.classList.remove('translate-x-full', 'opacity-0');
                    toastEl.classList.add('translate-x-0', 'opacity-100');
                }
            });

            setTimeout(() => {
                if (document.getElementById(toastId)) {
                    toastEl.classList.remove('translate-x-0', 'opacity-100');
                    toastEl.classList.add('translate-x-full', 'opacity-0');
                    setTimeout(() => { toastEl.remove(); }, 300);
                }
            }, 3000);
        }

        function showLoading(text = "Memproses data...") {
            const overlay = document.getElementById('loading-overlay');
            const txt = document.getElementById('loading-text');
            if (txt) txt.innerText = text;
            if (overlay) {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        }

        function saveCacheToLocal() {
            try {
                localStorage.setItem('tokoque_local_cache', JSON.stringify({
                    products: state.products,
                    customers: state.customers,
                    employees: state.employees,
                    transactions: state.transactions,
                    settings: state.settings,
                    lastTransaction: state.lastTransaction,
                    paperWidth: state.settings.paperWidth || state.paperWidth
                }));
            } catch(e) {}
        }

        function loadCacheFromLocal() {
            try {
                const raw = localStorage.getItem('tokoque_local_cache');
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (parsed.products && Array.isArray(parsed.products)) state.products = parsed.products;
                if (parsed.customers && Array.isArray(parsed.customers)) state.customers = parsed.customers;
                if (parsed.employees && Array.isArray(parsed.employees) && parsed.employees.length > 0) state.employees = parsed.employees;
                if (parsed.transactions && Array.isArray(parsed.transactions)) state.transactions = parsed.transactions;
                if (parsed.settings && typeof parsed.settings === 'object') {
                    state.settings = { ...state.settings, ...parsed.settings };
                    if (state.settings.scriptUrl && !localStorage.getItem('tokoque_script_url')) {
                        localStorage.setItem('tokoque_script_url', state.settings.scriptUrl);
                    }
                }
                if (parsed.lastTransaction) state.lastTransaction = parsed.lastTransaction;
                if (parsed.paperWidth) {
                    state.paperWidth = parsed.paperWidth;
                    if (!state.settings.paperWidth) state.settings.paperWidth = parsed.paperWidth;
                }
                return true;
            } catch(e) { return false; }
        }

        async function kirimDataKeCloud(payload) {
            const url = getActiveScriptUrl();
            if (!url) return;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify(payload)
                });
                return await res.json();
            } catch (e) {
                console.warn("Kirim ke Google Sheets gagal, tersimpan lokal:", e);
                throw e;
            }
        }

        function playBarcodeBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        window.cetakStruk = async function() {
            const card = document.getElementById('receipt-box-card');
            let printHtml = '';
            if (card) {
                printHtml = card.innerHTML;
            } else if (state.lastTransaction) {
                printHtml = generateReceiptHTML(state.lastTransaction);
            }

            if (!printHtml) return showToast("Tidak ada data struk yang dapat dicetak.", "warning");

            const pType = state.settings.printerType || 'usb';

            if (pType === 'bluetooth') {
                if (state.bluetoothCharacteristic) {
                    try {
                        const plainText = generatePlainTextReceipt(state.lastTransaction);
                        const encoder = new TextEncoder();
                        const data = encoder.encode(plainText);
                        const chunkSize = 80;
                        for (let i = 0; i < data.length; i += chunkSize) {
                            const chunk = data.slice(i, i + chunkSize);
                            if (state.bluetoothCharacteristic.writeValueWithoutResponse) {
                                await state.bluetoothCharacteristic.writeValueWithoutResponse(chunk);
                            } else {
                                await state.bluetoothCharacteristic.writeValue(chunk);
                            }
                        }
                        showToast(`Struk dicetak ke Bluetooth: ${state.settings.bluetoothName || 'Thermal BT'}`, "success");
                        return;
                    } catch(err) {
                        showToast("Koneksi Bluetooth gagal, beralih ke dialog cetak USB...", "warning");
                    }
                } else {
                    showToast("Printer Bluetooth belum tersambung.", "warning");
                    openModalHardware('bluetooth');
                    return;
                }
            }

            if (state.directPort) {
                try {
                    const plainText = generatePlainTextReceipt(state.lastTransaction);
                    const encoder = new TextEncoder();
                    const writer = state.directPort.writable.getWriter();
                    await writer.write(encoder.encode(plainText));
                    writer.releaseLock();
                    showToast(`Struk dicetak ke ${state.settings.usbPrinterName || 'Printer USB'}`, "success");
                    return;
                } catch(err) {}
            }

            const receiptArea = document.getElementById('receipt-print-area');
            if (receiptArea) receiptArea.innerHTML = printHtml;

            try {
                let printFrame = document.getElementById('thermal-print-iframe');
                if (!printFrame) {
                    printFrame = document.createElement('iframe');
                    printFrame.id = 'thermal-print-iframe';
                    printFrame.className = 'fixed right-0 bottom-0 w-0 h-0 border-0 opacity-0 pointer-events-none';
                    document.body.appendChild(printFrame);
                }

                const widthSetting = state.settings.paperWidth || state.paperWidth || '58mm';
                const widthStr = (widthSetting === '80mm') ? '72mm' : '48mm';
                const doc = printFrame.contentWindow.document;
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>${state.settings.usbPrinterName || 'Struk Transaksi'}</title>
                        <style>
                            @page { size: auto; margin: 0mm !important; }
                            * {
                                margin: 0;
                                padding: 0;
                                box-sizing: border-box;
                                color: #000000 !important;
                                background: transparent !important;
                            }
                            html, body {
                                width: 100% !important;
                                margin: 0 !important;
                                padding: 0 !important;
                                background: #ffffff !important;
                                font-family: 'Courier New', Courier, monospace !important;
                                font-size: 11px !important;
                                line-height: 1.25 !important;
                            }
                            .receipt-wrapper {
                                width: ${widthStr};
                                max-width: ${widthStr};
                                margin: 0 auto;
                                padding: 1mm 1mm;
                            }
                            table {
                                width: 100% !important;
                                border-collapse: collapse !important;
                                font-family: 'Courier New', Courier, monospace !important;
                                font-size: 11px !important;
                            }
                            td {
                                vertical-align: top;
                                padding: 1px 0;
                            }
                            .dashed-divider {
                                border-bottom: 1px dashed #000000;
                                margin: 4px 0;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="receipt-wrapper">
                            ${printHtml}
                        </div>
                    </body>
                    </html>
                `);
                doc.close();

                setTimeout(() => {
                    try {
                        printFrame.contentWindow.focus();
                        printFrame.contentWindow.print();
                    } catch (err) {
                        window.print();
                    }
                }, 100);
            } catch (e) {
                window.print();
            }
        };

        function generatePlainTextReceipt(trx) {
            if (!trx) return '';
            let cust = state.customers.find(c => c.id_pelanggan === trx.id_pelanggan);
            let widthChars = (state.settings.paperWidth === '80mm') ? 42 : 32;
            let line = "-".repeat(widthChars) + "\n";
            let res = "\x1B\x40\x1B\x61\x01"; // Reset printer & rata tengah
            res += `${(state.settings.storeName || 'TOKO SULUNG').toUpperCase()}\n`;
            res += `${state.settings.address || '-'}\n`;
            res += `Telp: ${state.settings.phone || '-'}\n`;
            res += line + "\x1B\x61\x00"; // Rata kiri
            res += `No: ${trx.id_transaksi}\n`;
            res += `Tgl: ${trx.tanggal} ${trx.waktu}\n`;
            res += `Kasir: ${trx.nama_kasir}\n`;
            res += `Pelanggan: ${cust ? cust.nama : 'Umum'}\n` + line;

            (trx.items || []).forEach(it => {
                res += `${it.nama}\n`;
                let left = `${it.qty} x ${it.harga_jual || it.harga}`;
                let right = `${formatRp((it.harga_jual || it.harga) * it.qty)}`;
                let space = Math.max(1, widthChars - left.length - right.length);
                res += left + " ".repeat(space) + right + "\n";
            });
            res += line;

            if (trx.diskon > 0) {
                let dLeft = "Diskon:";
                let dRight = `-${formatRp(trx.diskon)}`;
                let dSpace = Math.max(1, widthChars - dLeft.length - dRight.length);
                res += dLeft + " ".repeat(dSpace) + dRight + "\n";
            }

            // TOTAL: Label di kiri, nominal disejajarkan rata kanan dengan belanjaan
            let totLeft = "TOTAL:";
            let totRight = `${formatRp(trx.total)}`;
            let totSpace = Math.max(1, widthChars - totLeft.length - totRight.length);
            res += totLeft + " ".repeat(totSpace) + totRight + "\n";

            // Metode, Bayar, Kembalian tetap rata kiri
            res += `Metode: ${trx.metode}\n`;
            res += `Bayar: ${formatRp(trx.bayar)}\n`;
            res += `Kembalian: ${formatRp(trx.kembalian)}\n` + line;

            res += `\x1B\x61\x01${state.settings.receiptFooter || 'Terima kasih atas kunjungan Anda!\nBarang yang dibeli tidak dapat ditukar/dikembalikan.'}\n\n\n\n\x1D\x56\x00`;
            return res;
        }

        window.cetakUlangStrukTerakhir = function() {
            if (!state.lastTransaction) return showToast("Belum ada riwayat transaksi sebelumnya.", "warning");
            tampilkanStruk(state.lastTransaction);
        };

        function initTokoQueApp() {
            loadCacheFromLocal();
            const savedSession = localStorage.getItem('tokoque_session');
            if (savedSession) {
                try { state.user = JSON.parse(savedSession); } catch(e) {}
            }
            renderApp();
            syncData(false);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTokoQueApp);
        } else {
            initTokoQueApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!app) return;
            if (!state.user) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderContent();
            }
            if (window.lucide) lucide.createIcons();
        }

        function getLoginHTML() {
            const bgImage = "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&q=80&w=1600";
            return `
                <div class="h-screen w-screen relative flex items-center justify-center p-4 overflow-hidden select-none bg-slate-900">
                    <div class="absolute inset-0 z-0">
                        <img src="${bgImage}" alt="Background Toko" class="w-full h-full object-cover filter brightness-[0.4] contrast-105 scale-105 transition-transform duration-1000">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-900/60 to-slate-950/70 mix-blend-multiply"></div>
                    </div>

                    <div class="w-full max-w-sm rounded-3xl p-6 sm:p-8 relative z-10 fade-in text-center bg-white/95 backdrop-blur-xl border border-white/50 shadow-2xl flex flex-col">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg border-2 border-white/60">
                            <i data-lucide="store" class="w-8 h-8 sm:w-10 sm:h-10"></i>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">${state.settings.storeName || 'TokoQue'}</h1>
                        <p class="text-slate-500 text-[11px] sm:text-xs font-bold mt-1 uppercase tracking-wider">Aplikasi Kasir POS & Inventori</p>

                        <!-- Form Login 1 Kolom Tunggal (Hanya PIN / Sandi) -->
                        <form onsubmit="handleLogin(event)" class="mt-6 space-y-4 text-left flex flex-col w-full">
                            <div id="login-error" class="hidden bg-rose-50 text-rose-600 p-2.5 rounded-xl text-xs font-bold border border-rose-200 text-center"></div>

                            <div class="w-full">
                                <label class="block text-xs font-bold text-slate-700 mb-1.5">PIN / Password Kasir</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i data-lucide="lock" class="w-4 h-4"></i></div>
                                    <input type="password" id="login-pin" required autofocus placeholder="Masukkan PIN atau Password..." class="w-full pl-10 pr-10 py-3 bg-white border-2 border-slate-200 rounded-xl outline-none focus:border-blue-600 focus:bg-white font-bold text-slate-800 text-xs sm:text-sm tracking-wider shadow-inner transition-all">
                                    <button type="button" onclick="togglePasswordVisibility('login-pin', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700" title="Tampilkan/Sembunyikan PIN">
                                        <i data-lucide="eye" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" id="btn-login-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 sm:py-3.5 rounded-xl transition-all shadow-lg hover:shadow-blue-500/25 active:scale-95 flex items-center justify-center gap-2 mt-1 text-xs sm:text-sm">
                                <span>MASUK KE SISTEM</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const p = document.getElementById('login-pin').value.trim();
            const err = document.getElementById('login-error');
            if (!p) return;

            loadCacheFromLocal();

            // Cek kecocokan PIN pada data lokal
            let emp = state.employees.find(x => String(x.pin || '').trim() === p);

            // Fallback cepat: Jika pengguna mengetik 123123 atau admin123 langsung jadikan Administrator
            if (!emp && (p === '123123' || p === 'admin123')) {
                emp = { id_karyawan: 'KRY001', nama: 'Administrator', username: 'admin', pin: p, role: 'admin', no_hp: '08123456789' };
                state.employees[0] = emp;
                saveCacheToLocal();
            }

            // Jika belum cocok, coba tarik dari cloud
            if (!emp) {

                try {
                    await syncData(false);
                    emp = state.employees.find(x => String(x.pin || '').trim() === p);
                } catch (syncErr) {
                    console.warn("Sinkron login gagal:", syncErr);
                } finally {
                    hideLoading();
                }
            }

            if (emp) {
                state.user = emp;
                localStorage.setItem('tokoque_session', JSON.stringify(emp));

                showLoading("Menyiapkan & menarik data toko...");
                try {
                    await Promise.race([
                        syncData(false),
                        new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 7000))
                    ]);
                } catch (syncErr) {
                    console.warn("Sinkron awal timeout, menggunakan cache lokal:", syncErr);
                } finally {
                    hideLoading();
                }

                renderApp();
                showToast(`Selamat bekerja, ${emp.nama}!`, "success");
            } else {
                err.innerText = "PIN atau Password salah!";
                err.classList.remove('hidden');
                const pinInput = document.getElementById('login-pin');
                if (pinInput) {
                    pinInput.focus();
                    pinInput.select();
                }

                    String(p.barcode || '').toLowerCase().includes(q)

            if (state.currentTab !== 'kasir') return;
            if (e.key === 'F1') {
                e.preventDefault();
                openModalCariBarangiPos();
            } else if (e.key === 'F7') {
                e.preventDefault();
                if (state.cart.length > 0) openModalBayar();
            } else if (e.key === 'F9') {
                e.preventDefault();
                cetakUlangStrukTerakhir();
            } else if (e.key === 'Delete' && e.ctrlKey) {
                e.preventDefault();
                clearCart();
            }
        });

        window.handleBarcodeEnter = function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = String(e.target.value || '').trim();
                if (!code) return;
                const lowerCode = code.toLowerCase();
                const prod = state.products.find(p => String(p.barcode || '').toLowerCase() === lowerCode);
                if (prod) {
                    playBarcodeBeep();
                    addToCart(prod.barcode);
                    state.searchKasirQuery = '';
                    e.target.value = '';
                    renderContent();
                } else {
                    openModalCariBarangiPos(code);
                }
            }
        };

        window.addToCart = function(barcode) {
            const prod = state.products.find(p => p.barcode === barcode);
            if (!prod) return;
            const existing = state.cart.find(item => item.barcode === barcode);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({
                    barcode: prod.barcode,
                    nama: prod.nama,
                    harga_jual: prod.harga_jual,
                    harga_beli: prod.harga_beli,
                    satuan: prod.satuan || 'Pcs',
                    qty: 1
                });
            }
            renderContent();
        };

        window.updateCartQty = function(barcode, delta) {
            const idx = state.cart.findIndex(i => i.barcode === barcode);
            if (idx === -1) return;
            state.cart[idx].qty += delta;
            if (state.cart[idx].qty <= 0) {
                state.cart.splice(idx, 1);
            }
            renderContent();
        };

        window.setCartItemQtyManual = function(barcode, val) {
            const idx = state.cart.findIndex(i => i.barcode === barcode);
            if (idx === -1) return;
            const parsed = parseInt(val) || 1;
            state.cart[idx].qty = Math.max(1, parsed);
            renderContent();
        };

        window.setCheckoutMethod = function(method) {
            window.activeCheckoutMethod = method;
            ['Cash', 'QRIS', 'Transfer', 'Kasbon'].forEach(m => {
                const btn = document.getElementById(`btn-metode-${m}`);
                if (btn) {
                    btn.className = (m === method) 
                        ? "p-2.5 rounded-xl border-2 font-black text-xs flex items-center justify-center gap-1.5 border-blue-600 bg-blue-50 text-blue-700 shadow-sm"
                        : "p-2.5 rounded-xl border-2 font-black text-xs flex items-center justify-center gap-1.5 border-slate-200 text-slate-600 hover:bg-slate-50";
                }
            });

            const tunaiWrapper = document.getElementById('bayar-tunai-wrapper');
            if (tunaiWrapper) {
                if (method === 'Cash') tunaiWrapper.classList.remove('hidden');
                else tunaiWrapper.classList.add('hidden');
            }
        };

        window.setUangCepat = function(nominal, total) {
            const input = document.getElementById('input-nominal-bayar');
            if (input) {
                input.value = Number(nominal).toLocaleString('id-ID');
                hitungKembalianModal(total);
            }
        };

        window.hitungKembalianModal = function(total) {
            const input = document.getElementById('input-nominal-bayar');
            const lbl = document.getElementById('label-kembalian-bayar');
            if (!input || !lbl) return;
            let val = Number(String(input.value).replace(/\D/g, '') || 0);
            let kembali = val - total;
            lbl.innerText = formatRp(Math.max(0, kembali));
            lbl.className = kembali < 0 ? "text-rose-600 font-black text-sm" : "text-emerald-600 font-black text-sm";
        };

        window.eksekusiPembayaranFinal = async function(total) {
            const method = window.activeCheckoutMethod || 'Cash';
            let bayar = total;
            let kembalian = 0;

            if (method === 'Cash') {
                const inputBayar = document.getElementById('input-nominal-bayar');
                bayar = Number(String(inputBayar ? inputBayar.value : total).replace(/\D/g, '') || total);
                if (bayar < total) return showToast("Jumlah uang tunai kurang dari total belanja!", "warning");
                kembalian = bayar - total;
            } else if (method === 'Kasbon') {
                if (!state.selectedCustomerKasir) return showToast("Pilih pelanggan untuk pembayaran Kasbon (Hutang)!", "warning");
                bayar = 0;
                kembalian = 0;
            }

            const now = new Date();
            const idTrx = "TRX" + now.getTime();
            const tgl = now.toISOString().slice(0, 10);
            const wkt = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            const trxData = {
                id_transaksi: idTrx,
                tanggal: tgl,
                waktu: wkt,
                id_kasir: state.user.id_karyawan,
                nama_kasir: state.user.nama,
                id_pelanggan: state.selectedCustomerKasir || '',
                total: total,
                diskon: state.diskonNominal || 0,
                bayar: bayar,
                kembalian: kembalian,
                metode: method,
                items: [...state.cart]
            };

            state.cart.forEach(item => {
                const p = state.products.find(x => x.barcode === item.barcode);
                if (p) p.stok = Math.max(0, p.stok - item.qty);
            });

            if (method === 'Kasbon') {
                const cust = state.customers.find(c => c.id_pelanggan === state.selectedCustomerKasir);
                if (cust) cust.hutang = (cust.hutang || 0) + total;
            }

            state.transactions.unshift(trxData);
            state.lastTransaction = trxData;
            saveCacheToLocal();

            closeModal();
            tampilkanStruk(trxData);

            state.cart = [];
            state.diskonNominal = 0;
            renderContent();

            if (state.settings.autoPrint) {
                setTimeout(() => { cetakStruk(); }, 300);
            }

            kirimDataKeCloud({
                action: 'bayar_transaksi',
                ...trxData,
                cart: trxData.items
            });
        };

                kategori: kategori,
                harga_beli: beli,
                harga_jual: jual,
                stok: stok,
                satuan: satuan

                if (idx !== -1) state.products[idx] = payload;
            } else {
                state.products.push(payload);

            closeModal();

            showToast("Barang berhasil disimpan!", "success");

            kirimDataKeCloud({ action: 'simpan_barang', old_barcode: oldBarcode, ...payload });

        // FUNGSI IMPORT CSV DENGAN PENGIRIMAN BATCH LANGSUNG KE GOOGLE SHEETS
        window.prosesImportCSV = async function() {
            const fileInput = document.getElementById('csv-file-input');
            if (!fileInput || !fileInput.files.length) {
                return showToast("Pilih file CSV terlebih dahulu!", "warning");
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                let count = 0;
                let parsedItems = [];

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line || line.startsWith('sep=')) continue;
                    let cols = line.split(';').map(c => c.replace(/['"]+/g, '').trim());
                    if (cols.length < 5 || cols[0].toLowerCase() === 'barcode') continue;

                    let barcode = cols[0];
                    let nama = cols[1];
                    let kategori = cols[2] || 'Umum';
                    let beli = Number(String(cols[3]).replace(/\D/g, '') || 0);
                    let jual = Number(String(cols[4]).replace(/\D/g, '') || 0);
                    let stok = Number(String(cols[5] || 0).replace(/[^\d-]/g, ''));
                    let satuan = cols[6] || 'Pcs';

                    if (nama) {
                        const itemObj = {
                            barcode: barcode,
                            nama: nama,
                            kategori: kategori,
                            harga_beli: beli,
                            harga_jual: jual,
                            stok: stok,
                            satuan: satuan
                        };
                        parsedItems.push(itemObj);

                        const existing = state.products.find(x => x.barcode === barcode);
                        if (existing) {
                            existing.nama = nama;
                            existing.kategori = kategori;
                            existing.harga_beli = beli;
                            existing.harga_jual = jual;
                            existing.stok += stok;
                            existing.satuan = satuan;
                        } else {
                            state.products.push(itemObj);
                        }
                        count++;
                    }
                }

                saveCacheToLocal();
                closeModal();
                renderContent();

                // Kirim langsung ke Google Sheets secara Batch
                showLoading(`Mengirim ${count} barang ke Google Sheets...`);
                try {
                    await kirimDataKeCloud({
                        action: 'import_batch_barang',
                        items: parsedItems
                    });
                    showToast(`Berhasil menyimpan ${count} barang ke Google Sheets!`, "success");
                } catch(err) {
                    showToast(`Tersimpan lokal, namun gagal sinkron ke cloud: ${err.message}`, "warning");
                } finally {
                    hideLoading();
                }
            };
            reader.readAsText(fileInput.files[0]);
        };

        window.simpanPelanggan = async function(e, id) {
            e.preventDefault();
            const nama = document.getElementById('mp-nama').value.trim();
            const hp = document.getElementById('mp-hp').value.trim() || '-';
            const alamat = document.getElementById('mp-alamat').value.trim() || '-';

            const payload = {
                id_pelanggan: id || ('CUST' + Date.now().toString().slice(-6)),
                nama: nama,
                no_hp: hp,
                alamat: alamat,
                hutang: id ? (state.customers.find(x => x.id_pelanggan === id)?.hutang || 0) : 0,
                catatan: '-'
            };

            if (id) {
                const idx = state.customers.findIndex(x => x.id_pelanggan === id);
                if (idx !== -1) state.customers[idx] = { ...state.customers[idx], ...payload };
            } else {
                state.customers.push(payload);
            }

            saveCacheToLocal();
            closeModal();
            renderContent();
            showToast("Data pelanggan berhasil disimpan!", "success");

            kirimDataKeCloud({ action: 'simpan_pelanggan', ...payload });
        };

        window.prosesBayarKasbon = function(e, id) {
            e.preventDefault();
            const cust = state.customers.find(c => c.id_pelanggan === id);
            if (!cust) return;
            const inputVal = Number(document.getElementById('mbk-nominal').value.replace(/\D/g, '') || 0);

            cust.hutang = Math.max(0, cust.hutang - inputVal);
            saveCacheToLocal();
            closeModal();
            renderContent();

            e.preventDefault();

            if (!trx) return;

            const newMetode = document.getElementById('et-metode').value;
            const newCust = document.getElementById('et-pelanggan').value;
            const newNote = document.getElementById('et-catatan').value.trim();

            if (trx.metode === 'Kasbon' && newMetode !== 'Kasbon') {
                const oldC = state.customers.find(c => c.id_pelanggan === trx.id_pelanggan);
                if (oldC) oldC.hutang = Math.max(0, (oldC.hutang || 0) - trx.total);
            } else if (trx.metode !== 'Kasbon' && newMetode === 'Kasbon') {
                const newC = state.customers.find(c => c.id_pelanggan === newCust);
                if (newC) newC.hutang = (newC.hutang || 0) + trx.total;
            }

            trx.metode = newMetode;
            trx.id_pelanggan = newCust;
            trx.catatan = newNote;

            saveCacheToLocal();
            closeModal();
            renderContent();
            showToast("Transaksi berhasil diperbarui!", "success");

        window.simpanKaryawan = async function(e, id) {

            const nama = document.getElementById('mk-nama').value.trim();
            const username = document.getElementById('mk-user').value.trim();
            const pin = document.getElementById('mk-pin').value.trim();
            const role = document.getElementById('mk-role').value;
            const no_hp = document.getElementById('mk-hp').value.trim() || '-';

            const payload = {
                id_karyawan: id || ('KRY' + Date.now().toString().slice(-4)),
                nama: nama,
                username: username,
                pin: pin,
                role: role,
                no_hp: no_hp
            };

            if (id) {
                const idx = state.employees.findIndex(x => x.id_karyawan === id);
                if (idx !== -1) state.employees[idx] = { ...state.employees[idx], ...payload };
            } else {
                state.employees.push(payload);
            }

            saveCacheToLocal();
            closeModal();
            renderContent();
            showToast("Data karyawan berhasil disimpan!", "success");

            kirimDataKeCloud({ action: 'simpan_karyawan', ...payload });

        window.simpanUrlScriptDanTarik = function() {

            const val = input.value.trim();
            if (!val) {
                return showToast("Masukkan URL Google Apps Script yang valid!", "warning");
            }
            localStorage.setItem('tokoque_script_url', val);
            state.settings.scriptUrl = val;
            saveCacheToLocal();
            showToast("URL Google Apps Script berhasil disimpan!", "success");
            syncData(true);
        };

        window.gantiDatabaseDanBersihkanData = function() {
            const input = document.getElementById('cfg-script-url');
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                return showToast("Masukkan URL Google Apps Script yang valid!", "warning");
            }

            openConfirmModal("Ganti Database & Tarik Bersih", "Apakah Anda ingin menyimpan URL baru dan membersihkan data cache toko lama agar data baru dari Spreadsheet ini dimuat ulang?", async () => {
                localStorage.setItem('tokoque_script_url', val);
                state.settings.scriptUrl = val;
                state.products = [];
                state.customers = [];
                state.cart = [];
                saveCacheToLocal();
                showLoading("Menyambungkan ke spreadsheet baru...");
                try {
                    await syncData(true);
                    showToast("Database baru berhasil tersambung & disinkronkan!", "success");
                } catch(e) {
                    showToast("Gagal mengambil data dari URL baru: " + e.message, "error");
                } finally {
                    hideLoading();
                    renderApp();
                }
            });
        };

            if (sAddr) state.settings.address = sAddr.value.trim() || '-';
            if (sPhon) state.settings.phone = sPhon.value.trim() || '-';
            if (sFoot) state.settings.receiptFooter = sFoot.value.trim() || '-';

            // PENTING: Simpan juga URL yang sedang diketik agar tidak hilang saat re-render
            if (sUrl && sUrl.value.trim()) {
                const urlVal = sUrl.value.trim();
                localStorage.setItem('tokoque_script_url', urlVal);
                state.settings.scriptUrl = urlVal;
            }

            saveCacheToLocal();

            const adminEmp = state.employees.find(x => x.role === 'admin');
            if (adminEmp) {

        window.hubungkanBluetooth = async function() {
            if (!navigator.bluetooth) return showToast("Browser tidak mendukung Web Bluetooth.", "error");
            try {
                showLoading("Mencari printer Bluetooth...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '000018f0-0000-1000-8000-00805f9b34fb',
                        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
                        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
                        0xFFE0, 0xFF00, 0xFEE7, 0x18F0
                    ]
                });

                showLoading(`Menyambungkan ke ${device.name || 'Printer'}...`);
                const server = await device.gatt.connect();

                let service = null;
                const knownServices = [
                    '000018f0-0000-1000-8000-00805f9b34fb',
                    'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
                    '49535343-fe7d-4ae5-8fa9-9fafd205e455',
                    0xFFE0, 0xFF00, 0xFEE7, 0x18F0
                ];

                for (const s of knownServices) {
                    try {
                        service = await server.getPrimaryService(s);
                        if (service) break;
                    } catch(e) {}
                }

                if (!service) {
                    const services = await server.getPrimaryServices();
                    if (services && services.length > 0) service = services[0];
                }

                if (!service) throw new Error("Service printer tidak terdeteksi pada perangkat ini.");

                const characteristics = await service.getCharacteristics();
                let writeChar = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (!writeChar && characteristics.length > 0) writeChar = characteristics[0];

                if (!writeChar) throw new Error("Karakteristik cetak tidak ditemukan.");

                state.bluetoothDevice = device;
                state.bluetoothCharacteristic = writeChar;
                state.settings.printerType = 'bluetooth';
                state.settings.bluetoothName = device.name || 'Printer Bluetooth';
                state.settings.defaultPrinterName = device.name || 'Printer Bluetooth';

                device.addEventListener('gattserverdisconnected', () => {
                    state.bluetoothCharacteristic = null;
                    showToast("Printer Bluetooth terputus.", "warning");
                });

                saveCacheToLocal();
                hideLoading();
                openModalHardware('bluetooth');
                showToast(`Printer Bluetooth "${device.name || 'Thermal BT'}" berhasil tersambung!`, "success");
            } catch(err) {
                hideLoading();
                if (err.name !== 'NotFoundError') {
                    console.warn("Bluetooth connection error:", err);
                    showToast("Gagal menyambungkan: " + (err.message || err), "error");
                }
            }
        };

        async function syncData(isManual = false) {
            const syncIcon = document.getElementById('sync-icon');
            const statusBadge = document.getElementById('cloud-status-badge');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            const url = getActiveScriptUrl();
            if (!url || url.trim() === '') {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
                if (statusBadge) {
                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> URL Kosong`;
                    statusBadge.className = "inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-rose-50 text-rose-600 border border-rose-200";
                }
                if (isManual) showToast("URL Google Apps Script belum diisi! Buka tab Pengaturan.", "warning");
                return;
            }

            try {
                const cacheBuster = new Date().getTime();
                const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'nocache=' + cacheBuster;
                
                let response;
                try {
                    response = await fetch(fetchUrl);
                } catch (netErr) {
                    throw new Error("KONEKSI DITOLAK GOOGLE (CORS Error): Google memblokir akses karena izin 'Who has access' belum diset ke 'Anyone'. Ikuti panduan Deploy!");
                }

                const responseText = await response.text();
                let rawData;

                try {
                    rawData = JSON.parse(responseText);
                } catch (parseError) {
                    if (responseText.includes('ServiceLogin') || responseText.includes('accounts.google.com') || responseText.includes('<html') || responseText.trim().startsWith('<')) {
                        throw new Error("IZIN AKSES BELUM 'ANYONE': Google mengarahkan request ke halaman login. Ubah pengaturan Deployment di Google Apps Script.");
                    } else {
                        throw new Error("Respon server bukan format JSON. Pastikan sudah menjalankan fungsi setupDatabase() di Apps Script.");
                    }
                }

                if (rawData && rawData.error) {
                    throw new Error("Pesan dari Spreadsheet: " + rawData.error);
                }

                let data = rawData;
                if (rawData && rawData.data) data = rawData.data;

                let productCount = 0;
                let customerCount = 0;

                if (data.products && Array.isArray(data.products)) {
                    state.products = data.products.map(p => ({
                        barcode: String(p.barcode || p.id_barang || p.kode_barcode || p.kode_barang || '').trim(),
                        nama: String(p.nama || p.nama_barang || '').trim(),
                        kategori: String(p.kategori || 'Umum').trim(),
                        harga_beli: Number(String(p.harga_beli || p.harga_modal || 0).replace(/\D/g, '')),
                        harga_jual: Number(String(p.harga_jual || p.harga || 0).replace(/\D/g, '')),
                        stok: Number(String(p.stok || p.qty || 0).replace(/[^\d-]/g, '')),
                        satuan: String(p.satuan || 'Pcs').trim()
                    })).filter(p => p.nama !== '');
                    productCount = state.products.length;
                }

                if (data.customers && Array.isArray(data.customers)) {
                    state.customers = data.customers.map(c => ({
                        id_pelanggan: String(c.id_pelanggan || c.id || '').trim(),
                        nama: String(c.nama || c.nama_pelanggan || '').trim(),
                        no_hp: String(c.no_hp || c.telepon || c.hp || '-').trim(),
                        alamat: String(c.alamat || '-').trim(),
                        hutang: Number(String(c.hutang || c.kasbon || 0).replace(/\D/g, '')),
                        catatan: String(c.catatan || '-').trim()
                    })).filter(c => c.nama !== '');
                    customerCount = state.customers.length;
                }

                if (data.employees && Array.isArray(data.employees) && data.employees.length > 0) {
                    state.employees = data.employees.map(e => ({
                        id_karyawan: String(e.id_karyawan || e.id || '').trim(),
                        nama: String(e.nama || '').trim(),
                        username: String(e.username || '').trim(),
                        pin: String(e.pin || e.password || '').trim(),
                        role: String(e.role || 'kasir').toLowerCase().trim(),
                        no_hp: String(e.no_hp || '-').trim()
                    })).filter(e => e.username !== '');
                }

                if (data.transactions && Array.isArray(data.transactions)) {
                    state.transactions = data.transactions;
                }

                if (data.settings && typeof data.settings === 'object') {
                    const currentScriptUrl = state.settings.scriptUrl || localStorage.getItem('tokoque_script_url') || '';
                    state.settings = { ...state.settings, ...data.settings };
                    if (currentScriptUrl) state.settings.scriptUrl = currentScriptUrl;
                }

                saveCacheToLocal();
                if (state.user) renderContent();

                if (statusBadge) {
                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Terhubung (${productCount} Brg)`;
                    statusBadge.className = "inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
                }

                if (isManual) {
                    showToast(`Data berhasil ditarik: ${productCount} Barang, ${customerCount} Pelanggan.`, "success");
                }
            } catch (err) {
                console.error("Gagal sinkron database:", err);
                if (statusBadge) {
                    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Gagal Sambung`;
                    statusBadge.className = "inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-rose-50 text-rose-600 border border-rose-200 cursor-pointer";
                    statusBadge.onclick = () => openModalPanduanAksesGoogle(err.message);
                }
                if (isManual) {
                    openModalPanduanAksesGoogle(err.message);
                }
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }

        window.diagnosaKoneksiScript = async function() {

            try {
                const start = Date.now();
                const res = await fetch(testUrl + (testUrl.includes('?') ? '&' : '?') + 'ping=1&nocache=' + Date.now());
                const text = await res.text();
                const duration = Date.now() - start;

                hideLoading();

                try {
                    const parsed = JSON.parse(text);

                        openModalPanduanAksesGoogle(`URL tersambung dalam ${duration}ms, tetapi Spreadsheet melaporkan error:\n"${parsed.error}"\n\nPastikan ID Spreadsheet sudah dimasukkan di baris atas Code.gs.`);

                        const totalB = (parsed.products || []).length;

                        syncData(true);
                    }
                } catch(e) {
                    openModalPanduanAksesGoogle(`Server merespon dalam ${duration}ms namun mengembalikan HTML (bukan data JSON TokoQue). Ini menandakan izin akses 'Who has access' belum diset ke 'Anyone'.`);
                }
            } catch(fetchErr) {
                hideLoading();
                openModalPanduanAksesGoogle(`Koneksi Ditolak Google (Network/CORS Error): Browser dilarang mengambil data dari URL ini karena pengaturan hak akses Deployment di Google Apps Script belum dibuka untuk umum.`);

        };

            if (!qrContainer) return;

            html5QrScannerInstance = new Html5Qrcode("qr-camera-reader");
            
            const config = {
                fps: 12,
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    return {
                        width: Math.floor(minEdge * 0.85),
                        height: Math.floor(minEdge * 0.5)
                    };
                },
                aspectRatio: 1.333
            };

            html5QrScannerInstance.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    playBarcodeBeep();
                    handleScannedBarcode(decodedText, target);
                },
                () => {}
            ).catch(err => {
                console.warn("Gagal membuka kamera:", err);
                showToast("Kamera tidak dapat diakses atau izin ditolak oleh browser.", "error");
                closeCameraScanner();
            });
        }

        function handleScannedBarcode(barcode, target) {
            const code = String(barcode || '').trim();
            if (!code) return;

            if (target === 'modal-barang') {
                closeCameraScanner();
                const inputBarcode = document.getElementById('mb-barcode');
                if (inputBarcode) {
                    inputBarcode.value = code;
                    showToast(`Barcode ${code} terbaca dari kamera!`, "success");
                }
            } else {
                closeCameraScanner();
                const lowerCode = code.toLowerCase();
                const prod = state.products.find(p => String(p.barcode || '').toLowerCase() === lowerCode);
                if (prod) {
                    addToCart(prod.barcode);
                    showToast(`${prod.nama} ditambahkan ke kasir!`, "success");
                } else {
                    showToast(`Barcode ${code} belum terdaftar di katalog.`, "warning");
                    openModalCariBarangiPos(code);
                }
            }
        }
    </script>
</body>
</html>
